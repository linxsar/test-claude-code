<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bingo online sencillo: bombo de 90 bolas y cartones aleatorios. Juega desde el móvil, la tablet o el ordenador.">
  <meta name="theme-color" content="#5b3cc4">
  <title>Bingo Online</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">🎱 Bingo Online</h1>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab is-active" role="tab" id="tab-bombo" aria-controls="panel-bombo" aria-selected="true" data-panel="bombo">Bombo</button>
      <button class="tab" role="tab" id="tab-cartones" aria-controls="panel-cartones" aria-selected="false" data-panel="cartones">Mis cartones</button>
    </nav>
  </header>

  <main class="app-main">
    <!-- Bombo (modo cantador) -->
    <section id="panel-bombo" class="panel is-active" role="tabpanel" aria-labelledby="tab-bombo">
      <div class="card bombo">
        <h2 class="section-title">Bombo</h2>
        <div class="bola-actual" id="bola-actual" aria-live="assertive" aria-atomic="true">–</div>
        <p class="contador"><span id="contador">0</span> / 90 bolas</p>

        <div class="controles">
          <button type="button" id="btn-sacar" class="btn btn-primary">Sacar bola</button>
          <button type="button" id="btn-auto" class="btn" aria-pressed="false">▶ Automático</button>
          <button type="button" id="btn-reiniciar-bombo" class="btn btn-danger">Nueva partida</button>
        </div>

        <div class="opciones">
          <label class="opcion" id="opcion-voz">
            <input type="checkbox" id="chk-voz">
            Cantar en voz alta
          </label>
          <label class="opcion">
            Velocidad
            <select id="sel-velocidad">
              <option value="3000">Rápida (3 s)</option>
              <option value="5000" selected>Normal (5 s)</option>
              <option value="8000">Lenta (8 s)</option>
            </select>
          </label>
        </div>

        <h3 class="subtitle">Últimas bolas</h3>
        <ol id="historial" class="historial" aria-label="Últimas bolas, de la más reciente a la más antigua"></ol>
      </div>

      <div class="card tablero-wrap">
        <h2 class="section-title">Panel de números</h2>
        <div id="tablero" class="tablero" aria-label="Números que han salido"></div>
      </div>
    </section>

    <!-- Cartones (modo jugador) -->
    <section id="panel-cartones" class="panel" role="tabpanel" aria-labelledby="tab-cartones">
      <div class="card cartones-controles">
        <h2 class="section-title">Mis cartones</h2>
        <div class="controles">
          <label class="opcion">
            Cartones
            <select id="sel-cantidad">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="6">6</option>
            </select>
          </label>
          <button type="button" id="btn-nuevos-cartones" class="btn btn-primary">Nuevos cartones</button>
          <button type="button" id="btn-limpiar-marcas" class="btn">Limpiar marcas</button>
        </div>
        <p class="ayuda">Toca un número para marcarlo. Te avisaremos cuando hagas línea o bingo.</p>
      </div>

      <div id="cartones" class="cartones"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Bingo de 90 bolas · Hecho con HTML, CSS y JavaScript</p>
  </footer>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="js/bombo.js"></script>
  <script src="js/carton.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
