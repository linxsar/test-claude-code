<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bombo de Bingo online de 90 bolas para jugar con cartones físicos. Funciona en el móvil, la tablet o el ordenador.">
  <meta name="theme-color" content="#5b3cc4">
  <title>Bingo Online</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">🎱 Bingo Online</h1>
    <button type="button" id="btn-pantalla" class="btn-pantalla" aria-label="Pantalla completa" title="Pantalla completa" hidden>⛶</button>
  </header>

  <main class="app-main">
    <section id="panel-bombo" class="panel" aria-label="Bombo">
      <div class="card bombo">
        <div class="bola-actual" id="bola-actual" aria-live="assertive" aria-atomic="true">–</div>
        <p class="contador"><span id="contador">0</span> / 90 bolas</p>

        <div class="controles">
          <button type="button" id="btn-sacar" class="btn btn-primary">Sacar bola</button>
          <button type="button" id="btn-auto" class="btn" aria-pressed="false">▶ Automático</button>
          <button type="button" id="btn-reiniciar-bombo" class="btn btn-danger">Nueva partida</button>
        </div>

        <div class="opciones">
          <label class="opcion" id="opcion-voz">
            <input type="checkbox" id="chk-voz">
            Cantar en voz alta
          </label>
          <label class="opcion">
            Velocidad
            <select id="sel-velocidad">
              <option value="3000">Rápida (3 s)</option>
              <option value="5000" selected>Normal (5 s)</option>
              <option value="8000">Lenta (8 s)</option>
            </select>
          </label>
        </div>

        <h3 class="subtitle">Últimas bolas</h3>
        <ol id="historial" class="historial" aria-label="Últimas bolas, de la más reciente a la más antigua"></ol>
      </div>

      <div class="card tablero-wrap">
        <h2 class="section-title">Panel de números</h2>
        <div id="tablero" class="tablero" aria-label="Números que han salido"></div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Bingo de 90 bolas</p>
  </footer>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="js/bombo.js?v=3"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
